name: CI

# Automatic triggers are paused until further notice: the GitHub Actions minutes ran out
# (Krystian's decision, 2026-10-02; docs/DECISIONS.md D-012). Run locally before every PR:
#   npm ci && npm run lint && npm run typecheck && npm test && npm run build \
#     && npm run format:check && npm audit --audit-level=high
# To restore (D-007), replace `workflow_dispatch:` below with:
#   pull_request:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
